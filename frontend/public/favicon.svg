  <circle cx="19.8" cy="18.2" r="1.3" fill="#FACC15"/>

  <!-- Nose Ribbon -->
  <rect x="15" y="16.5" width="2" height="3.5" rx="1" fill="#4F46E5"/>

  <!-- Front Pilot Skirt -->
